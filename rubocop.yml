# Equipe's shared RuboCop configuration: Rails Omakase, plus consistent
# formatting of multiline code, class structure, Lint, Security and Performance.

inherit_gem: { rubocop-rails-omakase: rubocop.yml }

require:
  - ./lib/rubocop/cop/equipe/it_in_single_line_block.rb
  - ./lib/rubocop/cop/equipe/assignment_in_template.rb
  - ./lib/rubocop/cop/equipe/non_restful_action.rb

AllCops:
  NewCops: enable
  # The ERB templates too, beside RuboCop's own files, for Equipe/AssignmentInTemplate.
  inherit_mode:
    merge:
      - Include
  Include:
    - "**/*.erb"

Lint:
  Enabled: true
  Exclude: ["**/*.erb"]
Security:
  Enabled: true
  Exclude: ["**/*.erb"]

# All the performance cops that are on by default, where Omakase only keeps
# FlatMap, plus SelectMap for filter_map. Tests stay excluded, as in Omakase.
Performance:
  Enabled: true
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "**/*.erb"
Performance/SelectMap:
  Enabled: true

# Two-space indentation, with methods below private/protected indented one step.
Layout/IndentationStyle:
  Enabled: true
  IndentationWidth: 2
Layout/IndentationWidth:
  Enabled: true
  Width: 2
Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: indented_internal_methods
Layout/DefEndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: def

# Multiline code, following Standard (standardrb): fixed indentation rather
# than aligning with the opening parenthesis. Dot position is left to the project.
Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation
Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent
Layout/ClosingParenthesisIndentation:
  Enabled: true
Layout/HashAlignment:
  Enabled: true
  EnforcedHashRocketStyle: key
  EnforcedColonStyle: key
Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent
Layout/ArrayAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation
Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent
Layout/BlockAlignment:
  Enabled: true
  EnforcedStyleAlignWith: start_of_block
Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: indented

# Multiline arrays have one element per line and the brackets on lines of their own.
Layout/FirstArrayElementLineBreak:
  Enabled: true
Layout/MultilineArrayLineBreaks:
  Enabled: true
Layout/MultilineArrayBraceLayout:
  Enabled: true
  EnforcedStyle: new_line

Layout/EmptyLines:
  Enabled: true

# The blocks of a concern are separated like defs.
Layout/EmptyLineBetweenDefs:
  Enabled: true
  DefLikeMacros: [included, prepended, class_methods, concerning]

Style/Lambda:
  Enabled: true
  EnforcedStyle: literal

# `it` for the only parameter of a single-line brace block, a named parameter
# in longer blocks. Both need Ruby 3.4 and are skipped on older targets.
Equipe/ItInSingleLineBlock:
  Enabled: true
Style/ItBlockParameter:
  Enabled: true
  EnforcedStyle: allow_single_line

# The same order in every class. Moving callbacks, associations and validations
# can change behavior, so the autocorrection is unsafe: review before moving,
# and keep an order that matters with an inline disable and the reason.
Layout/ClassStructure:
  Enabled: true
  Include:
    - app/**/*.rb
  Categories:
    module_inclusion: [include, prepend, extend]
    attribute_macros: [attr_accessor, attr_reader, attr_writer, attribute, enum, serialize, store_accessor, normalizes]
    association: [belongs_to, has_one, has_many, has_and_belongs_to_many, has_one_attached, has_many_attached, accepts_nested_attributes_for]
    validation: [validates, validate, validates_presence_of, validates_uniqueness_of, validates_associated]
    callback: [after_initialize, before_validation, after_validation, before_save, after_save, before_create, after_create, before_update, after_update, before_destroy, after_destroy, after_commit, after_rollback, after_touch]
    scope: [scope, default_scope]
    delegate: [delegate]
  ExpectedOrder:
    - module_inclusion
    - constants
    - public_attribute_macros
    - association
    - validation
    - callback
    - scope
    - public_delegate
    - public_class_methods
    - initializer
    - public_methods
    - protected_methods
    - private_methods

# Only the seven RESTful actions in a controller: every public method there is
# an action, so another one gets a controller of its own or goes private.
Equipe/NonRestfulAction:
  Enabled: true
  Include:
    - "**/app/controllers/**/*.rb"

# No local variables in ERB templates: a value a template names is the
# parameter of a block. The templates are read by this cop alone, so the other
# departments leave them out, Lint, Security and Performance in their sections
# above. To Lint/Syntax a template is not Ruby.
Equipe/AssignmentInTemplate:
  Enabled: true
  Include:
    - "**/*.erb"
Bundler:
  Exclude: ["**/*.erb"]
Gemspec:
  Exclude: ["**/*.erb"]
Layout:
  Exclude: ["**/*.erb"]
Metrics:
  Exclude: ["**/*.erb"]
Migration:
  Exclude: ["**/*.erb"]
Naming:
  Exclude: ["**/*.erb"]
Rails:
  Exclude: ["**/*.erb"]
Style:
  Exclude: ["**/*.erb"]
